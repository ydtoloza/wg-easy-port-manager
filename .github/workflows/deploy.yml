name: Build and publish commit images

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.dockerignore'

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test head
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'src/package-lock.json'
      - name: Validate source and generated UI
        working-directory: src
        run: |
          npm ci
          npm run lint
          npm run check:www-template
          npm run test:ci

  commits:
    name: Find code commits
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.commits.outputs.matrix }}
      head_image_sha: ${{ steps.commits.outputs.head_image_sha }}
    steps:
      - name: Checkout complete push history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build commit matrix
        id: commits
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            COMMITS=("$AFTER")
          else
            mapfile -t COMMITS < <(git rev-list --reverse "$BEFORE..$AFTER")
          fi

          CODE_COMMITS=()
          for COMMIT in "${COMMITS[@]}"; do
            if git diff-tree --root -m --no-commit-id --name-only -r "$COMMIT" \
              | grep -Eq '^(src/|Dockerfile$|\.dockerignore$)'; then
              CODE_COMMITS+=("$COMMIT")
            fi
          done

          if [[ ${#CODE_COMMITS[@]} -eq 0 ]]; then
            echo "The push did not contain a code-changing commit" >&2
            exit 1
          fi

          MATRIX=$(printf '%s\n' "${CODE_COMMITS[@]}" \
            | jq -Rsc 'split("\n") | map(select(length > 0)) | {sha: .}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "head_image_sha=${CODE_COMMITS[-1]}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.sha }}
    needs:
      - quality
      - commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.commits.outputs.matrix) }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.sha }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable commit image
        id: image_exists
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ matrix.sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish commit image
        if: steps.image_exists.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}:sha-${{ matrix.sha }}
          labels: |
            org.opencontainers.image.title=WG-Easy Port Manager
            org.opencontainers.image.description=WireGuard management with DNAT and per-client network policies
            org.opencontainers.image.revision=${{ matrix.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=CC-BY-NC-SA-4.0
          cache-from: type=gha,scope=main
          cache-to: type=gha,mode=max,scope=main

  promote:
    name: Update main image
    needs:
      - commits
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify this run is still the main tip
        id: tip
        shell: bash
        run: |
          REMOTE_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$REMOTE_SHA" == "${{ github.sha }}" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize image name
        if: steps.tip.outputs.current == 'true'
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.tip.outputs.current == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        if: steps.tip.outputs.current == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point main at the latest code commit
        if: steps.tip.outputs.current == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SOURCE_SHA: ${{ needs.commits.outputs.head_image_sha }}
        run: docker buildx imagetools create --tag "$IMAGE:main" "$IMAGE:sha-$SOURCE_SHA"
