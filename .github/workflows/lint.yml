name: Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ydtoloza'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'src/package-lock.json'

      - name: Validate source and generated UI
        working-directory: src
        run: |
          npm ci
          npm run lint
          npm run check:www-template
          npm run test:ci
