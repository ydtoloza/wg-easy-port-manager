name: Build Pull Request

on:
  pull_request:
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.dockerignore'

jobs:
  deploy:
    name: Validate Docker build
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ydtoloza'
    permissions:
      contents: read
    strategy:
      # The emulated arm64 leg intermittently dies with
      # `qemu: uncaught target signal 4 (Illegal instruction)` during npm ci —
      # a known runner/QEMU flake, not a code failure. Retry instead of
      # forcing maintainers to click re-run.
      max-attempts: 3
      fail-fast: false
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        platforms: linux/amd64,linux/arm64
        tags: wg-easy-port-manager:pr
        cache-from: type=gha
        cache-to: type=gha,mode=max
