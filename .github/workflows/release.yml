name: Publish stable release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  quality:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      major_minor: ${{ steps.version.outputs.major_minor }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # Pin to the commit the tag referenced when the workflow started:
        # the tag ref is mutable and could be force-moved while quality runs.
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'src/package-lock.json'
      - name: Verify tag and application versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src/package.json').version")
          APP_VERSION=$(node -p "require('./src/package.json').release.version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version must use MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ "$TAG_VERSION" != "$VERSION" || "$APP_VERSION" != "$VERSION" ]]; then
            echo "Tag, package version and application release version must match" >&2
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR.$MINOR" >> "$GITHUB_OUTPUT"
      - name: Validate source and generated UI
        working-directory: src
        run: |
          npm ci
          npm run lint
          npm run check:www-template
          npm run test:ci

  release:
    name: Publish stable image and GitHub Release
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # Pin to the exact commit the quality job validated: re-resolving the
        # mutable tag here would let a force-moved tag publish untested bytes
        # as latest/major aliases.
        with:
          ref: ${{ github.sha }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check stable image
        id: image_exists
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ needs.quality.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish stable image
        if: steps.image_exists.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.quality.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ needs.quality.outputs.major_minor }}
            ${{ steps.image.outputs.name }}:${{ needs.quality.outputs.major }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.title=WG-Easy Port Manager
            org.opencontainers.image.description=WireGuard management with DNAT and per-client network policies
            org.opencontainers.image.version=${{ needs.quality.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=CC-BY-NC-SA-4.0
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Restore stable aliases on a release rerun
        if: steps.image_exists.outputs.exists == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ needs.quality.outputs.version }}
          MAJOR_MINOR: ${{ needs.quality.outputs.major_minor }}
          MAJOR: ${{ needs.quality.outputs.major }}
        run: |
          set -euo pipefail
          ALIASES=(--tag "$IMAGE:$MAJOR_MINOR" --tag "$IMAGE:$MAJOR")
          if [[ "$(gh release view --json tagName --jq .tagName 2>/dev/null || true)" == "$GITHUB_REF_NAME" ]]; then
            ALIASES+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${ALIASES[@]}" "$IMAGE:$VERSION"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: WG-Easy Port Manager ${{ needs.quality.outputs.major_minor }}
          body_path: docs/releases/v${{ needs.quality.outputs.version }}.md
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
