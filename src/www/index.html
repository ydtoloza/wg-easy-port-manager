<!DOCTYPE html>
<html class="dark">

<head>
  <title>WireGuard</title>
  <meta charset="utf-8"/>
  <link href="./css/app.css?v=6" rel="stylesheet">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./img/favicon.png">
  <link rel="apple-touch-icon" href="./img/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Apply the stored theme before first paint (dark by default) to avoid a light flash. -->
  <script>try { var t = localStorage.theme; if (t === 'light' || (t === 'auto' && !matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.remove('dark'); } catch (e) {}</script>
</head>

<body>
  <!-- vue-app-template:start -->
  <div id="app">

    <!-- Toasts -->
    <div v-cloak class="toasts" aria-live="polite">
      <transition-group name="toast">
        <button v-for="toast in toasts" :key="toast.id" type="button" class="toast" :class="'toast-' + toast.type" @click="dismissToast(toast.id)">
          <span class="grow">{{ toast.msg }}</span>
          <span aria-hidden="true" class="muted">×</span>
        </button>
      </transition-group>
    </div>

    <div v-cloak>
      <template v-if="authenticated === true">
        <header class="top">
          <div class="top-in">
            <span class="brand"><img src="./img/logo.png" width="22" height="22" alt="" />WireGuard</span>
            <nav class="top-nav" :aria-label="$t('ui.panel')">
              <a href="#" :aria-current="view !== 'ports' ? 'page' : null" @click.prevent="navigate('panel')">{{ $t('ui.panel') }}</a>
              <a href="#/ports" :aria-current="view === 'ports' ? 'page' : null">{{ $t('ui.ports') }} <span v-if="totalPortRules" class="muted">{{ totalPortRules }}</span></a>
            </nav>
            <div class="top-actions">
              <div style="position:relative">
                <button type="button" class="btn btn-icon" style="position:relative" @click="toggleNotifications" :aria-label="$t('ui.notifications')" :aria-expanded="showNotifications ? 'true' : 'false'">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>
                  <span v-if="unreadCount > 0" class="badge-dot" aria-hidden="true">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
                </button>
                <div v-if="showNotifications" style="position:fixed;inset:0;z-index:30" @click="closeNotifications"></div>
                <div v-if="showNotifications" class="dropdown">
                  <div class="row" style="padding:10px 16px">
                    <strong class="grow">{{ $t('notifications.title') }}</strong>
                    <button type="button" class="btn-link small" @click="clearNotifications">{{ $t('notifications.clear') }}</button>
                  </div>
                  <div class="dropdown-list">
                    <p v-if="!notifications.length" class="empty small" style="margin:0">{{ $t('notifications.empty') }}</p>
                    <div v-for="entry in notificationsSlice" :key="entry.id" class="dropdown-item">
                      <span class="dot" :class="entry.type === 'success' ? 'dot-ok' : (entry.type === 'info' ? 'dot-off' : 'dot-bad')" style="margin-top:6px"></span>
                      <div style="min-width:0">
                        <div :class="{ strong: entry.at > notificationsReadAt }" style="overflow-wrap:anywhere">{{ entry.msg }}</div>
                        <div class="xsmall muted">{{ entry.at | timeago }}</div>
                      </div>
                    </div>
                  </div>
                  <div style="padding:10px 16px;border-top:1px solid var(--border);background:var(--subtle)">
                    <div class="xsmall muted strong" style="margin-bottom:4px">{{ $t('notifications.probes') }}</div>
                    <p v-if="!probeEntries().length" class="xsmall muted" style="margin:0">{{ $t('notifications.probeEmpty') }}</p>
                    <div v-for="(item, index) in probeEntries()" :key="'probe-' + index" class="row xsmall" style="flex-wrap:nowrap;padding:2px 0">
                      <span class="dot" :class="probeDotClass(item.client.id, item.rule.id)"></span>
                      <span class="mono">{{ item.rule.proto === 'both' ? 'TCP+UDP' : item.rule.proto.toUpperCase() }}/{{ item.rule.extPort }}</span>
                      <span class="muted grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ item.client.name }}</span>
                      <span>{{ $t('networkPolicy.verdict.' + item.verdict) }}</span>
                    </div>
                  </div>
                </div>
              </div>
              <button type="button" class="btn" @click="openServerConfig">{{ $t('ui.serverConfig') }}</button>
              <button type="button" class="btn" @click="toggleTraffic" :aria-pressed="uiShowTraffic ? 'true' : 'false'">{{ uiShowTraffic ? $t('ui.hideTraffic') : $t('ui.showTraffic') }}</button>
              <button type="button" class="btn" @click="toggleTheme">{{ theme === 'dark' ? $t('ui.themeLight') : $t('ui.themeDark') }}</button>
              <button v-if="requiresPassword" type="button" class="btn-link muted" style="color:var(--fg-muted)" @click="logout">{{ $t('logout') }}</button>
            </div>
          </div>
        </header>

        <main class="wrap">

          <!-- ───────────── Panel ───────────── -->
          <template v-if="view === 'panel'">
            <div class="row">
              <h1 class="grow">{{ $t('ui.panel') }}</h1>
              <label for="inputRC" class="btn" :title="$t('titleRestoreConfig')">{{ $t('restore') }}
                <input id="inputRC" type="file" name="configurationfile" accept="text/*,.json" @change="restoreConfig" class="sr-only" />
              </label>
              <a href="./api/wireguard/backup" class="btn" :title="$t('titleBackupConfig')">{{ $t('backup') }}</a>
              <button type="button" class="btn btn-primary" @click="clientCreate = true; clientCreateName = '';">{{ $t('newClient') }}</button>
            </div>

            <section v-if="uiShowTraffic" class="box" aria-labelledby="h-traffic">
              <div class="box-head">
                <h2 id="h-traffic">{{ $t('ui.networkTraffic') }} <span class="muted" style="font-weight:400">· wg0</span></h2>
                <div class="seg" role="group" :aria-label="$t('traffic.bandwidth')">
                  <button type="button" :aria-pressed="trafficRange === 'realtime' ? 'true' : 'false'" @click="setTrafficRange('realtime')">2m</button>
                  <button type="button" :aria-pressed="trafficRange === '1h' ? 'true' : 'false'" @click="setTrafficRange('1h')">1h</button>
                  <button type="button" :aria-pressed="trafficRange === '24h' ? 'true' : 'false'" @click="setTrafficRange('24h')">24h</button>
                  <button type="button" :aria-pressed="trafficRange === '30d' ? 'true' : 'false'" @click="setTrafficRange('30d')">30d</button>
                </div>
              </div>
              <div class="scroll-x" style="border-bottom:1px solid var(--border)">
                <table class="table num" style="min-width:560px">
                  <thead>
                    <tr>
                      <th>{{ $t('ui.series') }}</th>
                      <th class="right">{{ $t('ui.now') }}</th>
                      <th class="right">{{ $t('ui.average') }}</th>
                      <th class="right">{{ $t('ui.peak') }}</th>
                      <th class="right">{{ $t('ui.totalInRange') }}</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr v-for="s in trafficBwSeries" :key="s.key" :style="{ opacity: trafficHidden[s.key] ? 0.5 : 1 }">
                      <td>
                        <button type="button" class="btn-link strong" style="color:var(--fg)" :aria-pressed="trafficHidden[s.key] ? 'false' : 'true'" :aria-label="$t('ui.toggleSeries', { name: s.name })" @click="toggleSeries(s.key)">
                          <span class="swatch" :class="s.key === 'download' ? 'swatch-rx' : 'swatch-tx'"></span>{{ s.name }}
                        </button>
                      </td>
                      <td class="right strong" style="font-size:16px">{{ fmtSpeed(trafficStats[s.key].now) }}</td>
                      <td class="right">{{ fmtSpeed(trafficStats[s.key].avg) }}</td>
                      <td class="right">{{ fmtSpeed(trafficStats[s.key].peak) }}</td>
                      <td class="right">{{ fmtBytes(trafficStats[s.key].total) }}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="chart">
                <apexchart v-if="trafficBw.length" width="100%" height="300" :options="trafficChartOptions" :series="trafficChartSeries"></apexchart>
                <p v-else class="empty" style="margin:0">{{ $t('ui.noTraffic') }}</p>
              </div>
            </section>

            <div v-if="uiShowTraffic" class="cols">
              <section class="box col-main" aria-labelledby="h-server">
                <div class="box-head">
                  <h2 id="h-server">{{ $t('ui.server') }}</h2>
                  <span class="xsmall muted"><span class="swatch" style="background:var(--fg-muted)"></span>{{ $t('ui.system') }} <span class="swatch swatch-rx" style="margin-left:8px"></span>WG-Easy</span>
                </div>
                <div class="box-body" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px">
                  <div>
                    <div class="row"><strong class="grow">{{ $t('traffic.cpu') }}</strong>
                      <span v-if="traffic && traffic.cpu" class="num small">{{ (traffic.cpu.system || 0).toFixed(1) }}% <span class="muted">/ {{ (traffic.cpu.process || 0).toFixed(1) }}%</span></span>
                    </div>
                    <apexchart v-if="traffic && traffic.cpu && traffic.cpu.history.length" width="100%" height="120" :options="trafficCpuOptions" :series="trafficCpuSeries"></apexchart>
                    <p v-else class="empty small" style="margin:0">{{ $t('traffic.noData') }}</p>
                  </div>
                  <div>
                    <div class="row"><strong class="grow">{{ $t('traffic.ram') }}</strong>
                      <span v-if="traffic && traffic.mem" class="num small">{{ (traffic.mem.system || 0).toFixed(1) }}% <span class="muted">/ {{ (traffic.mem.process || 0).toFixed(1) }}%</span></span>
                    </div>
                    <apexchart v-if="traffic && traffic.mem && traffic.mem.history.length" width="100%" height="120" :options="trafficMemOptions" :series="trafficMemSeries"></apexchart>
                    <p v-else class="empty small" style="margin:0">{{ $t('traffic.noData') }}</p>
                  </div>
                </div>
              </section>

              <div class="col-side">
                <section class="box" aria-labelledby="h-ifaces">
                  <div class="box-head"><h2 id="h-ifaces">{{ $t('ui.interfaces') }}</h2></div>
                  <table v-if="traffic && traffic.interfaces && traffic.interfaces.length" class="table num">
                    <thead><tr><th>{{ $t('ui.iface') }}</th><th class="right">RX</th><th class="right">TX</th></tr></thead>
                    <tbody>
                      <tr v-for="iface in traffic.interfaces" :key="iface.id || iface.name">
                        <td class="mono">{{ iface.id || iface.name }}</td>
                        <td class="right nowrap">{{ fmtSpeed(iface.rxSpeed) }}<div class="xsmall muted">{{ $t('ui.peak') }} {{ fmtSpeed(iface.peakRx) }}</div></td>
                        <td class="right nowrap">{{ fmtSpeed(iface.txSpeed) }}<div class="xsmall muted">{{ $t('ui.peak') }} {{ fmtSpeed(iface.peakTx) }}</div></td>
                      </tr>
                    </tbody>
                  </table>
                  <p v-else class="empty small" style="margin:0">{{ $t('traffic.noData') }}</p>
                </section>
                <section v-if="traffic && traffic.peaks" class="box" aria-labelledby="h-totals">
                  <div class="box-head"><h2 id="h-totals">{{ $t('ui.sinceStart') }}</h2></div>
                  <div class="box-body">
                    <dl class="kv num">
                      <dt>{{ $t('ui.peak') }} ↓</dt><dd>{{ fmtSpeed(traffic.peaks.txSpeed) }}<span v-if="traffic.peakAt && traffic.peakAt.txSpeed" class="xsmall muted"> · {{ traffic.peakAt.txSpeed | timeago }}</span></dd>
                      <dt>{{ $t('ui.peak') }} ↑</dt><dd>{{ fmtSpeed(traffic.peaks.rxSpeed) }}<span v-if="traffic.peakAt && traffic.peakAt.rxSpeed" class="xsmall muted"> · {{ traffic.peakAt.rxSpeed | timeago }}</span></dd>
                      <template v-if="trafficSummary">
                        <dt>Total ↓</dt><dd>{{ fmtBytes(trafficSummary.totals.txBytes) }}</dd>
                        <dt>Total ↑</dt><dd>{{ fmtBytes(trafficSummary.totals.rxBytes) }}</dd>
                      </template>
                    </dl>
                  </div>
                </section>
              </div>
            </div>

            <section class="box" aria-labelledby="h-clients">
              <div class="box-head">
                <h2 id="h-clients">{{ $t('clients') }} <span v-if="clients" class="muted" style="font-weight:400">{{ $t('ui.clientsConnected', { online: onlineCount, total: clients.length }) }}</span></h2>
                <input v-model="clientSearch" type="search" :aria-label="$t('ui.search')" :placeholder="$t('ui.search')" style="height:28px;width:240px;max-width:100%" />
                <select v-model="clientFilter" :aria-label="$t('ui.filterStatus')" style="height:28px">
                  <option value="all">{{ $t('ui.filterAll') }}</option>
                  <option value="online">{{ $t('ui.filterOnline') }}</option>
                  <option value="offline">{{ $t('ui.filterOffline') }}</option>
                  <option value="disabled">{{ $t('ui.filterDisabled') }}</option>
                </select>
              </div>
              <div v-if="clients === null" class="empty"><div class="spinner"></div></div>
              <div v-else-if="clients.length === 0" class="empty">
                <p>{{ $t('noClients') }}</p>
                <button type="button" class="btn btn-primary" @click="clientCreate = true; clientCreateName = '';">{{ $t('newClient') }}</button>
              </div>
              <div v-else class="scroll-x">
                <table class="table" style="min-width:880px">
                  <thead>
                    <tr>
                      <th>{{ $t('ui.colName') }}</th>
                      <th>{{ $t('ui.colAddress') }}</th>
                      <th>{{ $t('ui.colStatus') }}</th>
                      <th>{{ $t('ui.colLastSeen') }}</th>
                      <th class="right">{{ $t('ui.colUsage') }}</th>
                      <th class="right">{{ $t('ui.colPorts') }}</th>
                      <th>{{ $t('ui.colEnabled') }}</th>
                      <th><span class="sr-only">{{ $t('ui.colActions') }}</span></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr v-for="client in filteredClients" :key="client.id" :class="{ off: !client.enabled }">
                      <td><a :href="'#/client/' + clientPathId(client.id)" class="strong" @click.prevent="jumpToPeer(client.id)">{{ client.name }}</a></td>
                      <td class="mono">{{ client.address }}</td>
                      <td class="nowrap"><span class="dot" :class="clientStatus(client).dot"></span>{{ clientStatus(client).label }}</td>
                      <td class="nowrap" :title="client.latestHandshakeAt ? dateTime(new Date(client.latestHandshakeAt)) : null">{{ client.latestHandshakeAt ? ago(new Date(client.latestHandshakeAt)) : $t('ui.never') }}</td>
                      <td class="right num nowrap">{{ client.transferTx != null ? fmtBytes(client.transferTx) : '—' }} / {{ client.transferRx != null ? fmtBytes(client.transferRx) : '—' }}</td>
                      <td class="right">{{ (client.portForwards || []).length || '—' }}</td>
                      <td><input type="checkbox" :checked="client.enabled" :aria-label="$t('ui.enableClient', { name: client.name })" @change="client.enabled ? disableClient(client) : enableClient(client)" /></td>
                      <td class="right nowrap">
                        <button type="button" class="btn-link" :disabled="!client.downloadableConfig" :title="!client.downloadableConfig ? $t('noPrivKey') : $t('showQR')" @click="qrcode = `./api/wireguard/client/${clientPathId(client.id)}/qrcode.svg`">{{ $t('ui.qr') }}</button>
                        <span class="muted">·</span>
                        <a :href="'./api/wireguard/client/' + clientPathId(client.id) + '/configuration'" :download="client.downloadableConfig ? 'configuration' : null" :class="{ 'is-disabled': !client.downloadableConfig }" :title="!client.downloadableConfig ? $t('noPrivKey') : $t('downloadConfig')" @click="preventUnavailableDownload($event, client)">{{ $t('ui.download_conf') }}</a>
                        <span class="muted">·</span>
                        <a :href="'#/client/' + clientPathId(client.id)" @click.prevent="jumpToPeer(client.id)">{{ $t('ui.open') }}</a>
                      </td>
                    </tr>
                    <tr v-if="!filteredClients.length"><td colspan="8" class="empty">{{ $t('ui.noMatch') }}</td></tr>
                  </tbody>
                </table>
              </div>
            </section>
          </template>

          <!-- ───────────── All ports ───────────── -->
          <template v-else-if="view === 'ports'">
            <div>
              <h1>{{ $t('allPorts.title') }}</h1>
              <p class="muted" style="margin:4px 0 0">{{ $t('ui.portsHint') }}</p>
            </div>
            <div class="row">
              <input v-model.trim="allPortsSearch" type="search" class="grow" style="min-width:220px" :aria-label="$t('allPorts.search')" :placeholder="$t('allPorts.search')" />
              <select v-model="allPortsProto" :aria-label="$t('ui.colProtocol')">
                <option value="all">{{ $t('allPorts.allProtos') }}</option>
                <option value="tcp">TCP</option>
                <option value="udp">UDP</option>
                <option value="both">TCP + UDP</option>
              </select>
              <select v-model="allPortsStatus" :aria-label="$t('ui.colReachable')">
                <option value="all">{{ $t('allPorts.allStatus') }}</option>
                <option value="ok">{{ $t('allPorts.statusOk') }}</option>
                <option value="problems">{{ $t('allPorts.statusProblems') }}</option>
                <option value="unknown">{{ $t('allPorts.statusUnknown') }}</option>
              </select>
            </div>
            <section class="box">
              <div class="scroll-x">
                <table class="table" style="min-width:760px">
                  <thead>
                    <tr>
                      <th>{{ $t('ui.colReachable') }}</th>
                      <th>{{ $t('ui.colPublic') }}</th>
                      <th>{{ $t('ui.colDestination') }}</th>
                      <th>{{ $t('ui.colProtocol') }}</th>
                      <th>{{ $t('ui.colClient') }}</th>
                      <th>{{ $t('ui.colProbe') }}</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr v-for="row in allPortsRows" :key="row.client.id + ':' + row.rule.id" :class="{ off: !row.client.enabled }">
                      <td class="nowrap"><span class="dot" :class="probeDotClass(row.client.id, row.rule.id)" :title="probeDotTitle(row.client, row.rule)"></span>{{ row.verdict ? $t('networkPolicy.verdict.' + row.verdict) : $t('networkPolicy.probeNever') }}</td>
                      <td class="mono">{{ row.rule.extPort }}</td>
                      <td class="mono">{{ row.client.address }}:{{ row.rule.intPort }}</td>
                      <td>{{ row.rule.proto === 'both' ? 'TCP + UDP' : row.rule.proto.toUpperCase() }}</td>
                      <td><a :href="'#/client/' + clientPathId(row.client.id)" @click.prevent="jumpToPeer(row.client.id)">{{ row.client.name }}</a></td>
                      <td class="muted">{{ row.at ? ago(row.at) : '—' }}</td>
                    </tr>
                    <tr v-if="!allPortsRows.length"><td colspan="6" class="empty">{{ $t('allPorts.empty') }}</td></tr>
                  </tbody>
                </table>
              </div>
            </section>
            <p class="muted small" style="margin:0">{{ $t('ui.rulesShown', { shown: allPortsRows.length, total: totalPortRules }) }}</p>
          </template>

          <!-- ───────────── Client detail ───────────── -->
          <template v-else>
            <div v-if="clients === null" class="empty"><div class="spinner"></div></div>
            <div v-else-if="!viewClient" class="box box-body">
              <p>{{ $t('ui.clientNotFound') }}</p>
              <a href="#" @click.prevent="navigate('panel')">{{ $t('ui.backToPanel') }}</a>
            </div>
            <template v-else>
              <div>
                <nav class="muted small" :aria-label="$t('ui.panel')"><a href="#" @click.prevent="navigate('panel')">{{ $t('ui.panel') }}</a> / {{ $t('clients') }} / {{ viewClient.name }}</nav>
                <div class="row" style="margin-top:4px">
                  <h1 class="grow">{{ viewClient.name }} <span class="badge" :class="{ ok: viewClient.enabled && viewClient.online }">{{ clientStatus(viewClient).label }}</span></h1>
                  <button type="button" class="btn" :disabled="!viewClient.downloadableConfig" :title="!viewClient.downloadableConfig ? $t('noPrivKey') : $t('showQR')" @click="qrcode = `./api/wireguard/client/${clientPathId(viewClient.id)}/qrcode.svg`">{{ $t('showQR') }}</button>
                  <button type="button" class="btn" :disabled="!viewClient.downloadableConfig" :title="!viewClient.downloadableConfig ? $t('noPrivKey') : $t('ui.viewConfig')" @click="viewConfiguration(viewClient)">{{ $t('ui.viewConfig') }}</button>
                  <a class="btn" :class="{ 'is-disabled': !viewClient.downloadableConfig }" :href="'./api/wireguard/client/' + clientPathId(viewClient.id) + '/configuration'" :download="viewClient.downloadableConfig ? 'configuration' : null" @click="preventUnavailableDownload($event, viewClient)">{{ $t('downloadConfig') }}</a>
                  <button type="button" class="btn" @click="viewClient.enabled ? disableClient(viewClient) : enableClient(viewClient)">{{ viewClient.enabled ? $t('ui.disable') : $t('ui.enable') }}</button>
                  <button type="button" class="btn btn-danger" @click="clientDelete = viewClient">{{ $t('deleteClient') }}</button>
                </div>
              </div>

              <div class="cols">
                <section class="box" style="flex:1 1 380px;min-width:0" aria-labelledby="h-details">
                  <div class="box-head"><h2 id="h-details">{{ $t('ui.details') }}</h2></div>
                  <div class="box-body">
                    <dl class="kv">
                      <dt>{{ $t('name') }}</dt>
                      <dd>
                        <span v-if="clientEditNameId === viewClient.id" class="row">
                          <input v-model="clientEditName" :aria-label="$t('name')" @keyup.enter="updateClientName(viewClient, clientEditName); clientEditNameId = null" @keyup.escape="clientEditNameId = null" />
                          <button type="button" class="btn btn-sm" @click="updateClientName(viewClient, clientEditName); clientEditNameId = null">{{ $t('ui.save') }}</button>
                          <button type="button" class="btn-link small" @click="clientEditNameId = null">{{ $t('cancel') }}</button>
                        </span>
                        <span v-else>{{ viewClient.name }} <button type="button" class="btn-link small" @click="clientEditName = viewClient.name; clientEditNameId = viewClient.id">{{ $t('ui.edit') }}</button></span>
                      </dd>
                      <dt>IPv4</dt>
                      <dd>
                        <span v-if="clientEditAddressId === viewClient.id" class="row">
                          <input v-model="clientEditAddress" class="mono" aria-label="IPv4" @keyup.enter="updateClientAddress(viewClient, clientEditAddress, undefined); clientEditAddressId = null" @keyup.escape="clientEditAddressId = null" />
                          <button type="button" class="btn btn-sm" @click="updateClientAddress(viewClient, clientEditAddress, undefined); clientEditAddressId = null">{{ $t('ui.save') }}</button>
                          <button type="button" class="btn-link small" @click="clientEditAddressId = null">{{ $t('cancel') }}</button>
                        </span>
                        <span v-else><span class="mono">{{ viewClient.address }}</span> <button type="button" class="btn-link small" @click="clientEditAddress = viewClient.address; clientEditAddressId = viewClient.id">{{ $t('ui.edit') }}</button></span>
                      </dd>
                      <template v-if="viewClient.addressV6">
                        <dt>IPv6</dt>
                        <dd>
                          <span v-if="clientEditAddressV6Id === viewClient.id" class="row">
                            <input v-model="clientEditAddressV6" class="mono" aria-label="IPv6" @keyup.enter="updateClientAddress(viewClient, undefined, clientEditAddressV6); clientEditAddressV6Id = null" @keyup.escape="clientEditAddressV6Id = null" />
