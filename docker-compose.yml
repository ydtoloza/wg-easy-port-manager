volumes:
  etc_wireguard:

services:
  wg-easy-port-manager:
    image: ghcr.io/ydtoloza/wg-easy-port-manager:${IMAGE_TAG:-2.0.0}
    container_name: wg-easy-port-manager
    env_file: .env
    environment:
      LANG: ${WG_EASY_LANG:-es}
      WG_HOST: ${WG_HOST:?Set WG_HOST in .env}
      PASSWORD_HASH: ${PASSWORD_HASH:?Set PASSWORD_HASH in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      WG_PERSISTENT_KEEPALIVE: ${WG_PERSISTENT_KEEPALIVE:-25}
      WG_DEVICE: ${WG_DEVICE:-eth0}

    volumes:
      - etc_wireguard:/etc/wireguard
    restart: unless-stopped
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
