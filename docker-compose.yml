volumes:
  etc_wireguard:

services:
  wg-easy-port-manager:
    image: ghcr.io/ydtoloza/wg-easy-port-manager:latest
    container_name: wg-easy-port-manager
    environment:
      - LANG=es
      - WG_HOST=${WG_HOST}
      - PASSWORD_HASH=${PASSWORD_HASH:?Set PASSWORD_HASH en .env (genera uno con: docker run --rm ghcr.io/ydtoloza/wg-easy-port-manager wgpw TU_PASSWORD)}
      - WG_PERSISTENT_KEEPALIVE=25
      - WG_DEVICE=eth0

    volumes:
      - etc_wireguard:/etc/wireguard
    restart: unless-stopped
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      - NET_RAW
